<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f11; font-family: sans-serif; color: #fff; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #eee; }
    
    /* Сетка галереи */
    .gallery-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
        gap: 15px; 
        max-width: 1200px; 
        margin: 0 auto; 
    }
    
    /* Карточки */
    .gallery-item { 
        position: relative; 
        background: #1a1a1e; 
        border-radius: 8px; 
        overflow: hidden; 
        aspect-ratio: 1/1; 
        cursor: pointer; 
    }
    .gallery-item img, .gallery-item video { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
    }
    .item-num {
        position: absolute; top: 10px; left: 10px; 
        background: rgba(0,0,0,0.6); padding: 3px 8px; 
        border-radius: 4px; font-size: 12px; font-weight: bold;
    }

    /* Окно просмотра на весь экран */
    .lightbox { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.9); display: none; 
        justify-content: center; align-items: center; z-index: 9999; 
    }
    .lightbox.active { display: flex; }
    .lightbox-content { max-width: 90%; max-height: 90%; position: relative; }
    .lightbox-content img, .lightbox-content video { 
        max-width: 100%; max-height: 85vh; border-radius: 4px; 
    }
    .close-btn { 
        position: absolute; top: -40px; right: 0; 
        background: none; border: none; color: #fff; 
        font-size: 35px; cursor: pointer; 
    }
</style>
<h1>Моя Галерея</h1>

<div class="gallery-grid" id="gallery"></div>

<div class="lightbox" id="lightbox">
    <div class="lightbox-content">
        <button class="close-btn" id="closeBtn">&times;</button>
        <div id="lightboxMedia"></div>
    </div>
</div>

<script>
    // НАСТРОЙКА: Просто укажите, сколько ВСЕГО файлов (примерно) лежит в папке
    const totalFilesCount = 30; 

    // Список форматов, которые скрипт проверит для каждого номера
    const formats = ['.jpg', '.jpeg', '.png', '.gif', '.mp4', '.webm', '.JPG', '.JPEG', '.PNG', '.GIF'];
    
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxMedia = document.getElementById('lightboxMedia');
    const closeBtn = document.getElementById('closeBtn');

    // Безопасная функция проверки одного файла
    function testAndRender(num) {
        let formatIndex = 0;

        function tryNextFormat() {
            if (formatIndex >= formats.length) return; // Если ни один формат не подошел, пропускаем номер
            
            const currentFormat = formats[formatIndex];
            const fileUrl = num + currentFormat;
            
            const img = new Image();
            
            // Если это картинка/гифка и она успешно нашлась на хостинге
            img.onload = function() {
                createCard(num, fileUrl, false);
            };
            
            // Если картинка не нашлась, проверяем, может это видео?
            img.onerror = function() {
                if (currentFormat === '.mp4' || currentFormat === '.webm') {
                    const video = document.createElement('video');
                    video.src = fileUrl;
                    
                    video.onloadeddata = function() {
                        createCard(num, fileUrl, true);
                    };
                    
                    video.onerror = function() {
                        formatIndex++;
                        tryNextFormat();
                    };
                } else {
                    formatIndex++;
                    tryNextFormat();
                }
            };
            
            img.src = fileUrl;
        }
        
        tryNextFormat();
    }

    // Функция создания карточки на экране
    function createCard(num, fileUrl, isVideo) {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        const numBadge = document.createElement('div');
        numBadge.className = 'item-num';
        numBadge.innerText = num;
        item.appendChild(numBadge);

        if (isVideo) {
            const video = document.createElement('video');
            video.src = fileUrl;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            item.addEventListener('mouseenter', () => video.play().catch(()=>{}));
            item.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
            item.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = fileUrl;
            img.loading = 'lazy';
            item.appendChild(img);
        }

        item.addEventListener('click', () => {
            lightboxMedia.innerHTML = '';
            if (isVideo) {
                lightboxMedia.innerHTML = `<video src="${fileUrl}" controls autoplay style="max-width:100%"></video>`;
            } else {
                lightboxMedia.innerHTML = `<img src="${fileUrl}">`;
            }
            lightbox.classList.add('active');
        });

        // Добавляем в галерею и сразу сортируем карточки по порядку номеров
        gallery.appendChild(item);
        Array.from(gallery.children)
            .sort((a, b) => parseInt(a.querySelector('.item-num').innerText) - parseInt(b.querySelector('.item-num').innerText))
            .forEach(node => gallery.appendChild(node));
    }

    // Запускаем поочередную проверку всех номеров
    for (let i = 1; i <= totalFilesCount; i++) {
        testAndRender(i);
    }

    // Закрытие окна просмотра
    closeBtn.addEventListener('click', () => { lightbox.classList.remove('active'); lightboxMedia.innerHTML = ''; });
    lightbox.addEventListener('click', (e) => { if(e.target === lightbox) { lightbox.classList.remove('active'); lightboxMedia.innerHTML = ''; } });
</script>
