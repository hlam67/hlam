<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f11; font-family: sans-serif; color: #fff; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #eee; }
    
    /* Сетка галереи */
    .gallery-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
        gap: 15px; 
        max-width: 1200px; 
        margin: 0 auto; 
    }
    
    /* Карточки */
    .gallery-item { 
        position: relative; 
        background: #1a1a1e; 
        border-radius: 8px; 
        overflow: hidden; 
        aspect-ratio: 1/1; 
        cursor: pointer; 
    }
    .gallery-item img, .gallery-item video { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
    }
    .item-num {
        position: absolute; top: 10px; left: 10px; 
        background: rgba(0,0,0,0.6); padding: 3px 8px; 
        border-radius: 4px; font-size: 12px; font-weight: bold;
    }

    /* Окно просмотра на весь экран */
    .lightbox { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.9); display: none; 
        justify-content: center; align-items: center; z-index: 9999; 
    }
    .lightbox.active { display: flex; }
    .lightbox-content { max-width: 90%; max-height: 90%; position: relative; }
    .lightbox-content img, .lightbox-content video { 
        max-width: 100%; max-height: 85vh; border-radius: 4px; 
    }
    .close-btn { 
        position: absolute; top: -40px; right: 0; 
        background: none; border: none; color: #fff; 
        font-size: 35px; cursor: pointer; 
    }
</style>
<h1>Моя Галерея</h1>

<div class="gallery-grid" id="gallery"></div>

<div class="lightbox" id="lightbox">
    <div class="lightbox-content">
        <button class="close-btn" id="closeBtn">&times;</button>
        <div id="lightboxMedia"></div>
    </div>
</div>

<script>
    // НАСТРОЙКА: Просто перечислите ваши файлы по порядку с их расширениями!
    // Например: ['1.jpg', '2.mp4', '3.gif', '4.png', '5.jpeg']
    const myFiles = ['1.jpg', '2.mp4', '3.gif', '4.png']; 

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxMedia = document.getElementById('lightboxMedia');
    const closeBtn = document.getElementById('closeBtn');

    // Быстро создаем карточки на экране без тяжелых запросов
    myFiles.forEach((fileName, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        // Номер файла
        const num = document.createElement('div');
        num.className = 'item-num';
        num.innerText = index + 1;
        item.appendChild(num);

        const isVideo = fileName.endsWith('.mp4') || fileName.endsWith('.webm');

        if (isVideo) {
            const video = document.createElement('video');
            video.src = fileName;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            // Включаем видео только при наведении мышки
            item.addEventListener('mouseenter', () => video.play().catch(()=>{}));
            item.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
            item.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = fileName;
            img.loading = 'lazy';
            item.appendChild(img);
        }

        // Клик открывает на весь экран
        item.addEventListener('click', () => {
            lightboxMedia.innerHTML = '';
            if (isVideo) {
                lightboxMedia.innerHTML = `<video src="${fileName}" controls autoplay style="max-width:100%"></video>`;
            } else {
                lightboxMedia.innerHTML = `<img src="${fileName}">`;
            }
            lightbox.classList.add('active');
        });

        gallery.appendChild(item);
    });

    // Закрытие окна
    closeBtn.addEventListener('click', () => { lightbox.classList.remove('active'); lightboxMedia.innerHTML = ''; });
    lightbox.addEventListener('click', (e) => { if(e.target === lightbox) { lightbox.classList.remove('active'); lightboxMedia.innerHTML = ''; } });
</script>
