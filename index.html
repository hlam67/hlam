<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pseudo-Survival Game</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            background: #000;
        }
        #ui {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-family: monospace;
            font-size: 16px;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
        }
        .bar-container {
            width: 150px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            margin-bottom: 5px;
            height: 12px;
        }
        .bar {
            height: 100%;
            width: 100%;
        }
        #instructions {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
    <div id="ui">
        ЖИЗНЬ: <div class="bar-container"><div id="hpBar" class="bar" style="background: #ff3333;"></div></div>
        ГОЛОД: <div class="bar-container"><div id="foodBar" class="bar" style="background: #ffcc00;"></div></div>
        ЖАЖДА: <div class="bar-container"><div id="waterBar" class="bar" style="background: #33ccff;"></div></div>
        <div id="score">Дней прожито: 0</div>
        <div id="inventory" style="margin-top: 10px; color: #aaa;">Дрова: 0 | Ягоды: 0</div>
    </div>
    <div id="instructions">
        <strong>Управление:</strong><br>
        W, S — Вперед / Назад<br>
        A, D — Поворот камеры<br>
        E — Собрать ресурс (в упор)<br>
        F — Съесть ягоды (-Голод)<br>
        <span id="statusMsg" style="color: #00ff00; font-weight: bold;"></span>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
