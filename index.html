<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальный медиаплеер</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 500px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00adb5;
        }
        .media-box {
            width: 100%;
            height: 350px;
            border: 2px dashed #393e46;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #222831;
            margin-bottom: 20px;
        }
        .media-box img, .media-box video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .placeholder-text {
            color: #eeeeee;
            font-size: 14px;
        }
        .upload-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #00adb5;
            color: #ffffff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .upload-btn:hover {
            background-color: #007a80;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Медиаплеер</h1>
    <div class="media-box" id="mediaBox">
        <!-- По умолчанию пытается загрузить 1.gif -->
        <img id="mediaDisplay" src="1.gif" alt="Ожидание файла 1.gif или загрузки другого медиа" onerror="showPlaceholder()">
    </div>
    
    <label class="upload-btn" for="fileInput">Открыть файл (GIF, JPEG, PNG, MP4)</label>
    <input type="file" id="fileInput" accept="image/*,video/*">
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const mediaBox = document.getElementById('mediaBox');
    
    function showPlaceholder() {
        const display = document.getElementById('mediaDisplay');
        if (display && display.tagName === 'IMG' && display.getAttribute('src') === '1.gif') {
            mediaBox.innerHTML = '<div class="placeholder-text">Файл 1.gif не найден.<br>Нажмите кнопку ниже, чтобы выбрать GIF, JPEG, PNG или видео.</div>';
        }
    }

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        
        if (file.type.startsWith('video/')) {
            mediaBox.innerHTML = `<video src="${fileURL}" controls autoplay loop></video>`;
        } else if (file.type.startsWith('image/')) {
            mediaBox.innerHTML = `<img src="${fileURL}" alt="Загруженное изображение">`;
        }
    });
</script>

</body>
</html>
