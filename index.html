<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Game</title>
    
    <!-- 1. Подключаем файл внешних стилей style.css -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 2. Загружаем библиотеку Three.js из интернета -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Контейнер для отрисовки 3D графики движком -->
    <div id="canvas-container"></div>
    
    <!-- Прицел в центре экрана -->
    <div id="crosshair"></div>

    <!-- Показатели выживания (UI) -->
    <div id="ui">
        <div>Здоровье:</div>
        <div class="stat-bar"><div id="hp-fill" class="stat-fill"></div></div>
        <div>Сытость:</div>
        <div class="stat-bar"><div id="food-fill" class="stat-fill"></div></div>
        <div>Жажда:</div>
        <div class="stat-bar"><div id="water-fill" class="stat-fill"></div></div>
        
        <div id="inventory">
            🎒 Инвентарь:<br>
            • 🪵 Дерево: <span id="inv-wood">0</span><br>
            • 🍏 Яблоки: <span id="inv-apples">0</span>
        </div>
    </div>

    <!-- Подсказка взаимодействия с деревьями -->
    <div id="interaction-prompt">Нажмите [E], чтобы собрать ресурсы</div>

    <!-- Главный стартовый экран (фиксация мыши) -->
    <div id="blocker">
        <div id="instructions">
            <h2>3D ВЫЖИВАНИЕ В ЛЕСУ</h2>
            <p>Кликните по экрану, чтобы начать</p>
            <p style="font-size: 16px; color: #ccc;">
                Управление: WASD — Движение | Мышь — Обзор<br>
                Клавиша [E] — Собрать ресурсы / Рубить дерево
            </p>
        </div>
    </div>

    <!-- Экран проигрыша -->
    <div id="game-over">
        <h1>Вы погибли в лесу</h1>
        <button id="restart-btn" onclick="location.reload()">Начать заново</button>
    </div>

    <!-- 3. Подключаем основной код игры game.js в самом конце (после загрузки интерфейса) -->
    <script src="game.js"></script>
</body>
</html>
